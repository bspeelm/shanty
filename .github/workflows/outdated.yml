name: outdated

# Weekly, and never an automated bump. An installer that quietly moves its own
# pins is one whose output nobody can reproduce, and a client that quietly
# moves its dependencies is no different (§11). This opens one issue and keeps
# it current; a human decides what to do about it.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outdated:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: known vulnerabilities
        id: vuln
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          if govulncheck ./... > /tmp/vuln.txt 2>&1; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/vuln.txt

      - name: newer versions
        run: go list -m -u all > /tmp/outdated.txt 2>&1 || true

      - name: open or update the tracking issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # The date is the first line and nothing else, so that a week which
          # found the same thing can be recognised as such.
          {
            echo "Weekly dependency check, $(date -u +%Y-%m-%d)."
            echo
            echo "## govulncheck"
            echo
            if [ "${{ steps.vuln.outputs.clean }}" = "true" ]; then
              echo "No known vulnerabilities."
            else
              echo '```'
              cat /tmp/vuln.txt
              echo '```'
            fi
            echo
            echo "## Modules with newer versions"
            echo
            echo '```'
            grep '\[' /tmp/outdated.txt || echo "everything is current"
            echo '```'
            echo
            echo "The module budget is 30 (PLAN.md §0). Nothing here is bumped"
            echo "automatically; an upgrade is a commit somebody made on purpose."
          } > /tmp/body.md

          # The label the issue is found by. Created here rather than by hand,
          # because a workflow that needs somebody to have clicked something
          # once fails on a fresh clone and fails on a Monday.
          gh label create dependencies --color 0366d6 \
            --description "Weekly govulncheck and module freshness" 2>/dev/null || true

          behind=$(grep -c '\[' /tmp/outdated.txt || true)
          if [ "${{ steps.vuln.outputs.clean }}" = "true" ]; then
            headline="No known vulnerabilities. $behind module(s) behind."
          else
            headline="**govulncheck reports something.** $behind module(s) behind."
          fi

          existing=$(gh issue list --state open --label dependencies \
            --search "Weekly dependency check in:title" --json number -q '.[0].number')

          # No open issue means the first run, or that the last one was closed.
          # Closing it is how somebody asks to be told again from scratch.
          if [ -z "$existing" ]; then
            gh issue create --title "Weekly dependency check" \
              --label dependencies --assignee "$OWNER" --body-file /tmp/body.md
            exit 0
          fi

          # Editing an issue body notifies nobody: not the author, not a
          # watcher, not the assignee. A check that quietly rewrites itself
          # every week is one whose findings are never read, so a week that
          # found something different says so in a comment, which does notify,
          # and a week that found the same thing says nothing at all.
          gh issue view "$existing" --json body -q .body > /tmp/previous.md
          if diff -q <(sed 1d /tmp/previous.md | tr -d '\r') \
                     <(sed 1d /tmp/body.md) >/dev/null 2>&1; then
            echo "the same as last week; issue #$existing left alone"
            exit 0
          fi

          gh issue edit "$existing" --body-file /tmp/body.md
          gh issue comment "$existing" --body "$(printf '%s\n\n%s\n' \
            "$headline" \
            "This is different from last week. The issue body above has the detail.")"
          echo "updated and commented on issue #$existing"
