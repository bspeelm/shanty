name: release

on:
  push:
    tags: ['v*']

# Read-only at the top and named rather than inherited. The one job that needs
# to write says so, a scope at a time.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless signing: id-token mints the OIDC token that binds the
      # certificate to this workflow, attestations writes the result. There is
      # no private key to store, rotate or leak.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # The gates run again here rather than trusting the branch: a tag can be
      # pushed at any commit, including one CI never saw.
      - run: make check

      # A packet per release, and the release does not ship without one. What
      # it no longer does is grade a questionnaire: the answers a reviewer
      # needs are stated at the top of the packet, by whoever prepared it,
      # rather than left as blanks for them to fill in. Issues found in a
      # review are issues on GitHub, where the rest of the work already lives.
      - name: the release has a review packet
        run: |
          packet="docs/review/${GITHUB_REF_NAME}.md"
          test -f "$packet" || {
            echo "::error::no review packet at $packet"
            exit 1
          }
          echo "$packet is present"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Everything the release page offers, not only the archives. Attesting
      # the tarballs alone would leave checksums.txt -- the file the default
      # install trusts -- swappable by whoever could swap what it vouches for.
      - name: sign the release artifacts
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/shanty_*.tar.gz
            dist/checksums.txt

      # Published beside the artifacts so that verifying needs no GitHub
      # account: `gh attestation verify` without --bundle asks the API, which
      # requires a login; with one it reads from disk.
      - name: publish the attestation bundle
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" attestation.jsonl
          gh release upload "${GITHUB_REF_NAME}" attestation.jsonl --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
