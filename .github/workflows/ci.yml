name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default, named rather than inherited. The release workflow is
# the only one that gets write, and it gets it a job at a time.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
      # make check is lint, vet, race tests, budgets and standard. The
      # conformance check is inside the gate rather than beside it.
      #
      # One honest limit: the standard lives outside this repository and is not
      # published, so `make standard` skips here and runs only on the
      # maintainer's machine. A green check job is not evidence the standard
      # passed. Publishing it is what would close that gap.
      - run: make check

      # vendor/ is what a Copr build root uses in place of a network, so it has
      # to match go.mod exactly. The toolchain refuses to build when they
      # disagree; this says so on a pull request rather than in a build nobody
      # is watching.
      - name: vendor is in step with go.mod
        run: |
          go mod vendor
          git diff --exit-code --stat vendor/ || {
            echo "::error::vendor/ is out of step with go.mod; run go mod vendor"; exit 1; }

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # The release configuration is only otherwise read after a tag is pushed,
      # which is the one step that cannot be taken back.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: check

      - name: build every artifact the release would
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --snapshot --clean --skip=publish
        env:
          HOMEBREW_TAP_TOKEN: ''

      # Installing it is the only way to know the package works. Everything
      # asserted here has been wrong in a released package of some project or
      # other: a missing dependency, an unstripped build path, a binary
      # somewhere other than where the other package puts it.
      - name: install the deb and take it apart
        run: |
          deb=$(ls dist/shanty_*_amd64.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"

          # mpv is the whole reason this package declares anything.
          test "$(dpkg-deb -f "$deb" Depends)" = mpv || {
            echo "::error::the deb does not require mpv"; exit 1; }

          sudo apt-get install -y "./$deb"
          test "$(command -v shanty)" = /usr/bin/shanty
          shanty version

          # The completions the package placed are the ones this binary writes.
          diff <(shanty completions bash) /usr/share/bash-completion/completions/shanty
          diff <(shanty completions zsh) /usr/share/zsh/site-functions/_shanty
          diff <(shanty completions fish) /usr/share/fish/vendor_completions.d/shanty.fish

          if grep -qa "$GITHUB_WORKSPACE/vendor/" /usr/bin/shanty; then
            echo "::error::the packaged binary embeds build paths; -trimpath is not taking"; exit 1; fi

          sudo apt-get remove -y shanty
          test ! -e /usr/bin/shanty

      # The spec is built by Copr, which nothing here can reach. Parsing it is
      # what catches a version, a macro or a file list that will not build,
      # before the tag rather than after.
      - name: the rpm spec parses and its files agree with the deb
        run: |
          sudo apt-get install -y rpm
          rpmspec -q --srpm packaging/shanty.spec
          v=$(sed -n 's/^Version:[[:space:]]*//p' packaging/shanty.spec)
          test -n "$v" || { echo "::error::no Version: in the spec"; exit 1; }

          # Both packages put the binary in the same place, or a machine that
          # has had both ends up with two shantys.
          grep -q '%{_bindir}/%{name}' packaging/shanty.spec || {
            echo "::error::the spec does not install to the same bindir as the deb"; exit 1; }
          grep -q '^Requires:.*mpv' packaging/shanty.spec || {
            echo "::error::the spec does not require mpv"; exit 1; }

  crossbuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: make crossbuild

  # The suite runs where the artifact is built, not only where it is written.
  # A test that asks the machine a question -- "is mpv installed" -- passes on
  # a developer's box and fails in a minimal container, and the first anyone
  # hears of it is a broken package. This job is that question, asked early.
  buildroot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run --rm -v "$PWD":/src:ro -w /src golang:1.24-alpine sh -c '
            apk add --no-cache make git >/dev/null &&
            go test -mod=readonly ./...'

  # §8 as a job. The ran-count assertion is the point: a filter that stops
  # matching reports a clean run over nothing at all, and an isolation suite
  # that silently ran zero tests is worse than none, because it reads as proof.
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: |
          go test ./... -run Isolation -v | tee /tmp/isolation.log
          ran=$(grep -c '^--- PASS: TestIsolation' /tmp/isolation.log || true)
          echo "isolation tests that ran: $ran"
          if [ "$ran" -lt 4 ]; then
            echo "expected at least 4; the filter has stopped matching or a test was lost"
            exit 1
          fi

  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      # Run without a terminal on purpose: the golden files pin the colour
      # profile rather than detecting it, and this is where that would show.
      - run: go test ./internal/tui/... -v
      - name: the goldens are committed, not regenerated
        run: |
          go test ./internal/tui/ -update
          git diff --exit-code -- internal/tui/testdata || {
            echo "the golden files differ from what the code renders"
            exit 1
          }

  fuzz-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go test ./internal/subsonic/ -run=FuzzDecode -fuzz=FuzzDecode -fuzztime=60s

  # The only job that talks to a real server and a real player. Everything
  # else runs against the fake, which cannot say whether mpv accepts these
  # flags or whether Navidrome's responses decode into the shapes this client
  # expects.
  #
  # It asserts each subtest ran rather than trusting a green tick: t.Skip is
  # how this test reports a missing mpv or container runtime, and a skipped
  # integration suite reads exactly like a passing one.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mpv
      - run: mpv --version | head -1
      # A runner has no sound card, and mpv without one fails at the speaker
      # rather than at anything this project wrote. A null ALSA default gives
      # it somewhere to send the samples, which keeps the test on mpv's real
      # output path -- the alternative was an --ao option in production whose
      # only caller would have been this job.
      - name: give mpv somewhere to play to
        run: printf 'pcm.!default { type null }\nctl.!default { type null }\n' > "$HOME/.asoundrc"
      - run: |
          set -o pipefail
          go test -tags=integration ./cmd/shanty/ -run Integration -v -timeout=15m | tee /tmp/integration.log
          for name in auth browse stream scrobble; do
            grep -q -- "--- PASS: TestIntegrationVerticalSlice/$name" /tmp/integration.log || {
              echo "the $name subtest did not pass; it may have been skipped"
              exit 1
            }
          done
